# 完整学生预算试验集：每fold 2人，不是0.1%总体代表性评测集。
# 所有可预测时间步均参与评价；不允许再进行目标抽样或target_limit。
# 费用及适用范围见 docs/完整学生预算子集.md。
dataset:
  snapshot: ../../data/snapshots/nips_complete_students_budget_v1
  split: test
  validation_fold: 0
task:
  protocol: pykt_window
  level: question
  maxlen: 200
  min_seq_len: 3
model:
  pricing_file: ../pricing/jev-1.14.json
  api_key_file: ../../../.secrets/openrouter.key
execution:
  max_requests: 1000
