# Two-request adapter smoke configuration; use tools/smoke_jev_r2.py for the isolated two-target scope.
dataset:
  snapshot: ../../data/snapshots/nips_validation_iteration_02cny_v1
  split: validation
  validation_fold: 0
task:
  protocol: pykt_window
  level: question
  maxlen: 200
  min_seq_len: 3
model:
  adapter: openrouter_decisions
  model_id: typesafe/jev-1.14
  endpoint: https://openrouter.ai/api/alpha/decisions
  api_key_file: ../../../.secrets/openrouter.key
  pricing_file: ../pricing/jev-1.14-20261018.json
  decision_file: ../decisions/jev_r2_v1.yaml
  probability_strategy: noul
  parameters:
    provider:
      only: [typesafe]
      allow_fallbacks: false
execution:
  max_concurrency: 1
  max_requests: 2
  max_attempts: 1
  requests_per_minute: 60
  timeout_seconds: 60
