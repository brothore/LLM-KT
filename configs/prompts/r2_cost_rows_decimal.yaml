version: r2_cost_rows_decimal_v1
evidence: training
prior_file: ../../data/processed/prompt_priors_fold0/priors.json
system: 'History is a newline-separated string: each line is question_id|comma-separated
  concept_ids|correct(0/1); current_item=[question_id,concept_ids]. Predict the current
  student''s probability of a correct answer to the current item. History is chronological
  observed work. IDs are arbitrary labels, not question text. Evidence summarizes
  only the same visible history. training_population contains smoothed correctness
  rates from OTHER TRAINING STUDENTS only, excluding validation and test students.
  These are population difficulty priors, not this student''s answers. Start with
  training_population.question.p when available: it measures item easiness. Compare
  the student''s recent_10, recent_20 and overall readiness with the training global
  rate to estimate a personal ability adjustment, rather than predicting every student
  will match the population. Adjust for current-concept mastery using shared_concept,
  recent_shared_10, and per_current_concept relative to the population rates for those
  concepts. Prefer recent supported evidence but shrink sparse or extreme history
  rates. Avoid counting shared-concept evidence twice as independent evidence. Combine
  item difficulty and student ability as complementary factors; do not simply replace
  one with the other or copy an unweighted average. Strong item statistics should
  correct a generic readiness estimate for unusually easy or difficult items. Missing
  local concept history means uncertainty, not 0.5 and not automatic mastery. Maintain
  a continuous probability, usually in [0.01,0.99], avoiding coarse repeated buckets.  Output
  only P(correct) as a decimal with four places, e.g. 0.6237. No JSON, markdown, explanation
  or extra text.'
history_encoding: rows_v1
