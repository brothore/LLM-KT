dataset:
  snapshot: ../data/snapshots/assist2009
task:
  protocol: pykt_window
  level: question
  maxlen: 200
model:
  adapter: openai_compatible_chat
  model_id: qwen/qwen3.6-35b-a3b
  endpoint: https://openrouter.ai/api/v1/chat/completions
  api_key_env: OPENROUTER_API_KEY
  api_key_file: ../../.secrets/openrouter.key
  probability_strategy: json_probability
  pricing_file: pricing/qwen3.6-35b-a3b.json
  parameters:
    response_format:
      type: json_object
    max_tokens: 1024
execution:
  max_requests: 20
  requests_per_minute: 60
