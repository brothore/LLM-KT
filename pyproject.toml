[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-kt"
version = "0.1.0"
description = "Standalone configuration-driven knowledge tracing inference"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "PyYAML>=6,<7", "numpy>=1.24", "scikit-learn>=1.3"]

[project.optional-dependencies]
preprocess = ["pandas>=2,<3"]

[project.scripts]
llm-kt = "llm_kt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"llm_kt.vendor.pykt" = ["LICENSE"]
